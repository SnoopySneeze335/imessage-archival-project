name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No files over 5 MB
        run: scripts/ci/check-file-size.sh
      - name: No phone numbers or emails outside fixtures/
        run: scripts/ci/check-pii.sh

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generate the fixture backup
        run: cargo run --locked -p fixture-gen -- --out fixtures/out/backup-v1

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built app references no external hosts
        run: |
          # Namespace URIs and React's error-doc link are strings, not requests.
          if grep -rhoE 'https?://[A-Za-z0-9.-]+' dist \
              | grep -vE '^https?://(www\.w3\.org|react\.dev)$' | sort -u | grep .; then
            echo "Unexpected external URL in web/dist" >&2
            exit 1
          fi
