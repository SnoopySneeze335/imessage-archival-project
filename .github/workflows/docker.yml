name: Docker image

# Pull requests: build the image and smoke-test it. Pull requests from this
# repository (never from forks) also push it as ghcr.io/<owner>/imessage-ap:pr-<N>,
# so real-data checks can `docker pull` exactly what the PR builds.
# main and v* tags: push to ghcr.io/<owner>/imessage-ap.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner, as GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/imessage-ap
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: imessage-ap:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name smoke -p 8080:8080 -v "$RUNNER_TEMP/data:/data" imessage-ap:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsSI http://localhost:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          test "$(stat -c '%u:%g' "$RUNNER_TEMP/data")" = "99:100"
          docker exec smoke ps -o user= -C imessage-ap | grep -qx 99
          docker exec smoke ffmpeg -hide_banner -version > /dev/null
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy
          # First run: a setup code in the log, and the API needs a session.
          docker logs smoke 2>&1 | grep -Eq 'setup code: [A-Z0-9]{4}-[A-Z0-9]{4}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/archive)" = 401
          curl -fsS http://localhost:8080/api/auth/status | jq -e '.state == "setup" and .https == false'

      - name: Sign in over plain HTTP inside the image
        run: |
          printf 'smoke test password\n' | docker exec -i smoke imessage-ap set-password --stdin --data /data
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar -H 'Origin: http://localhost:8080' \
            -H 'Content-Type: application/json' -d '{"password":"smoke test password"}' \
            http://localhost:8080/api/auth/login)
          test "$code" = 204
          grep -q 'session' jar
          curl -fsS -b jar http://localhost:8080/api/archive | jq -e '.present == false'
          # A request from another site is refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://evil.example.com' \
            -H 'Content-Type: application/json' -d '{"password":"x"}' http://localhost:8080/api/auth/login)
          test "$code" = 403

      - name: Generate the fixture backup
        run: cargo run --locked -p fixture-gen -- --out "$RUNNER_TEMP/backups/fixture"

      - name: Import the fixture and copy its attachments inside the image
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-data"
          app() {
            docker run --rm --cpus=2 \
              -v "$RUNNER_TEMP/backups:/backups:ro" -v "$RUNNER_TEMP/fixture-data:/data" \
              imessage-ap:smoke "$@"
          }
          app ingest --backup /backups/fixture --data /data
          app attachments --backup /backups/fixture --data /data --limit 3
          app attachments --backup /backups/fixture --data /data
          app attachments --backup /backups/fixture --data /data | tee again.txt
          grep -Eq '^  files read +0 ' again.txt
          app stats --json --data /data | tee stats.json
          # Thumbnails (HEIC, a HEIF sequence, HEVC video and an MP4 with a
          # chnl v1 box included) need the image's own tools (decision 0006).
          jq -e '.archive
            | .attachment_files_pending_copy == 0
              and .attachment_files_copied == .attachments_with_file
              and .duplicates_skipped == 1
              and .thumbnails_made == 11 and .thumbnails_failed == 3
              and .derivatives_pending == 12' stats.json

      - name: Make previews and conversions inside the image, without the backup
        run: |
          app() {
            docker run --rm --cpus=2 -v "$RUNNER_TEMP/fixture-data:/data" imessage-ap:smoke "$@"
          }
          app migrate --data /data
          app derive --data /data --plan
          app derive --data /data --kind voice --min-free 1G
          app derive --data /data --kind image --limit 2
          app derive --data /data
          app derive --data /data | tee again.txt
          grep -Eq '^  files started +0$' again.txt
          app stats --json --data /data | tee stats.json
          # Every derived file is owned by PUID:PGID (99:100).
          test -z "$(find "$RUNNER_TEMP/fixture-data/derived" \( ! -uid 99 -o ! -gid 100 \) -print)"
          jq -e '.archive
            | .derivatives_pending == 0
              and .derivatives.preview == {"done":3,"made":2,"original":1,"failed":1,"pending":0,"bytes":.derivatives.preview.bytes}
              and .derivatives.video.made == 3 and .derivatives.video.original == 1 and .derivatives.video.failed == 1
              and .derivatives.audio.made == 2 and .derivatives.audio.failed == 1
              and .derivative_bytes > 0' stats.json

      - name: Render check on the fixture, with the databases and derived files moved
        run: |
          mkdir -p "$RUNNER_TEMP/moved/db"
          sudo mv "$RUNNER_TEMP/fixture-data/archive.db" "$RUNNER_TEMP/moved/db/"
          sudo rm -f "$RUNNER_TEMP/fixture-data/archive.db-wal" "$RUNNER_TEMP/fixture-data/archive.db-shm"
          # The whole folder, hidden .tmp included.
          sudo mv "$RUNNER_TEMP/fixture-data/derived" "$RUNNER_TEMP/moved/derived"
          app() {
            docker run --rm -v "$RUNNER_TEMP/fixture-data:/data" \
              -v "$RUNNER_TEMP/moved/db:/db" -v "$RUNNER_TEMP/moved/derived:/derived" \
              -e IMESSAGE_AP_DB_DIR=/db -e IMESSAGE_AP_DERIVED_DIR=/derived imessage-ap:smoke "$@"
          }
          app stats --json | tee stats.json
          jq -e '.archive.derivatives_pending == 0 and .archive.messages > 0' stats.json
          app derive --plan | tee plan.txt
          app check-render --json | tee render.json
          jq -e '.render_errors == 0 and .items + .reactions == .messages' render.json
          # An archive left in the data directory as well is refused.
          sudo cp "$RUNNER_TEMP/moved/db/archive.db" "$RUNNER_TEMP/fixture-data/"
          ! app stats > refused.txt 2>&1
          grep -q 'exists in both' refused.txt

      - name: Demo archive (invented data) inside the image
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          docker run -d --name demo --cpus=2 -p 8081:8080 -v "$RUNNER_TEMP/demo:/data" imessage-ap:smoke demo
          for i in $(seq 1 180); do
            curl -fsS http://localhost:8081/api/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8081/api/auth/status | jq -e '.demo == true and .state == "signed_out"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar -H 'Origin: http://localhost:8081' \
            -H 'Content-Type: application/json' -d '{"password":"demo1234"}' http://localhost:8081/api/auth/login)
          test "$code" = 204
          curl -fsS -b jar http://localhost:8081/api/archive | jq -e '.messages > 25000'
          docker logs demo 2>&1 | grep -E 'render errors +0'
          test -z "$(find "$RUNNER_TEMP/demo" \( ! -uid 99 -o ! -gid 100 \) -print)"

      - name: Smoke test logs
        if: failure()
        run: |
          docker logs smoke || true
          docker logs demo || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
