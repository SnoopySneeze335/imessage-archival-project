name: Docker image

# Pull requests: build the image and smoke-test it; nothing is pushed.
# main and v* tags: also push to ghcr.io/<owner>/imessage-ap.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner, as GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/imessage-ap
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: imessage-ap:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name smoke -p 8080:8080 -v "$RUNNER_TEMP/data:/data" imessage-ap:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsSI http://localhost:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          test "$(stat -c '%u:%g' "$RUNNER_TEMP/data")" = "99:100"
          docker exec smoke ps -o user= -C imessage-ap | grep -qx 99
          docker exec smoke ffmpeg -hide_banner -version > /dev/null
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy

      - name: Smoke test logs
        if: failure()
        run: docker logs smoke || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
